<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <title>Marshal Thresher Smart Assistant</title>
  
  <!-- Important for Bubblewrap / TWA -->
  <meta name="theme-color" content="#d70000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="full-screen" content="yes">

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <img src="logo.png" alt="Company Logo" class="logo">
  <h1>Marshal Thresher Smart Assistant</h1>
</header>

<main>

  <!-- Language Selection -->
  <div id="languageBox" class="card">
    <h2>ભાષા પસંદ કરો / भाषा चुने</h2>
    <select id="languageSelect">
      <option value="">-- Select Language --</option>
      <option value="gu">ગુજરાતી</option>
      <option value="hi">हिंदी</option>
      <option value="en">English</option>
    </select>
  </div>

<div id="modelBox" class="card hidden">
  <h2 id="modelTitle">Select Model</h2>
  <select id="modelSelect"></select>
</div>
  
  <!-- Crop + Problem -->
  <div id="selectionBox" class="card hidden">
    <h2 id="cropTitle"></h2>
    <select id="cropSelect"></select>

    <h2 id="problemTitle" class="mt-15"></h2>
    <select id="problemSelect"></select>

    <button id="ukelBtn" class="ukel-btn">Get Solution</button>
  </div>

  <!-- Summary -->
  <div id="summaryBox" class="card hidden"></div>

  <!-- Result -->
  <div id="resultBox" class="card hidden"></div>

  <!-- Action Buttons -->
  <div id="actionButtons" class="hidden action-container">
    <button id="backBtn" class="back-btn">Back</button>
    <button id="stopVoiceBtn" class="stop-btn">Stop Voice</button>
  </div>

</main>

<script src="app.js"></script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/Assistant/service-worker.js")
    .then(() => console.log("Service Worker Registered"));
}
</script>
</body>
</html>
