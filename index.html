<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Marshal Thresher Smart Assistant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <img src="logo.png" alt="Company Logo" class="logo">
  <h1>Marshal Thresher Smart Assistant</h1>
</header>

<main>

  <!-- Language Selection -->
  <div id="languageBox" class="card">
    <h2>Select Language</h2>
    <select id="languageSelect">
      <option value="">-- Select Language --</option>
      <option value="gu">ગુજરાતી</option>
      <option value="hi">हिंदी</option>
      <option value="en">English</option>
    </select>
  </div>

  <!-- Selection Section -->
  <div id="selectionBox" class="card hidden">

    <!-- ✅ NEW: MODEL SELECTION -->
    <h2 id="modelTitle">Select Model</h2>
    <select id="modelSelect">
      <option value="">-- Select Model --</option>
      <option value="shahenshah">Marshal Shahenshah</option>
      <option value="smart_single">Smart Single Shaft</option>
      <option value="jageerdar_single">Jageerdar Single Shaft</option>
      <option value="smart_double">Smart Double Shaft</option>
      <option value="jageerdar_double">Jageerdar Double Shaft</option>
      <option value="maharaja">Maharaja</option>
    </select>

    <!-- Crop -->
    <h2 id="cropTitle" class="mt-15"></h2>
    <select id="cropSelect"></select>

    <!-- Problem -->
    <h2 id="problemTitle" class="mt-15"></h2>
    <select id="problemSelect"></select>

    <button id="ukelBtn" class="ukel-btn">Get Solution</button>
  </div>

  <!-- Summary -->
  <div id="summaryBox" class="card hidden"></div>

  <!-- Result -->
  <div id="resultBox" class="card hidden"></div>

  <!-- Action Buttons -->
  <div id="actionButtons" class="hidden action-container">
    <button id="backBtn" class="back-btn">Back</button>
    <button id="stopVoiceBtn" class="stop-btn">Stop Voice</button>
  </div>

</main>

<script src="app.js"></script>
</body>
</html>
